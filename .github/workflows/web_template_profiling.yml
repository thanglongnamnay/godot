name: Web template with function names (profiling only)

# The one template the MeoDuKy web map editor ships (official 4.7-stable, dlink, no threads,
# release), linked with --profiling-funcs so browser flame charts show C++ function names
# instead of wasm-function[N]. This branch keeps no other workflow. Never ship the result.

on:
  push:
    branches: [web-template-profiling]
  workflow_dispatch:

env:
  EM_VERSION: 4.0.20
  GODOT_TAG: 4.7-stable

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Godot ${{ env.GODOT_TAG }}
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_TAG }}

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}

      - name: Set up Python and SCons
        run: python -m pip install scons==4.7.0

      - name: Build template (as the official build, plus names)
        run: |
          # Without debug_symbols the SConstruct links with -s, which strips the names that
          # --profiling-funcs keeps. debug_symbols=yes would add -g3 DWARF and change the
          # optimized output, so drop only the strip.
          grep -q 'env.AppendUnique(LINKFLAGS=\["-s"\])' SConstruct
          sed -i 's/env.AppendUnique(LINKFLAGS=\["-s"\])/pass/' SConstruct
          scons platform=web target=template_release threads=no dlink_enabled=yes production=yes linkflags=--profiling-funcs --jobs=$(nproc)
          ls -la bin
          # Fail here, not in the browser, if the names did not survive.
          unzip -o -q bin/godot.web.template_release.wasm32.nothreads.dlink.zip godot.side.wasm -d /tmp/tpl
          python3 - <<'PY'
          b = open('/tmp/tpl/godot.side.wasm', 'rb').read()
          p, size = 8, 0
          def leb():
              global p
              r = s = 0
              while True:
                  x = b[p]; p += 1; r |= (x & 127) << s; s += 7
                  if not x & 128: return r
          while p < len(b):
              sid = b[p]; p += 1; n = leb(); end = p + n
              if sid == 0:
                  l = leb()
                  if b[p:p + l] == b'name': size = n
              p = end
          print('name section bytes:', size)
          assert size > 100000, 'no function names in godot.side.wasm'
          PY

      - name: Upload template
        uses: actions/upload-artifact@v4
        with:
          name: web-dlink-nothreads-release-profiling-${{ env.GODOT_TAG }}
          path: bin/godot.web.template_release.wasm32.nothreads.dlink.zip
